# /etc/nginx/sites-available/portfolio — reverse proxy in front of the container.
# Get certs first:  sudo certbot --nginx -d mafnan.dev -d www.mafnan.dev
server {
  listen 80;
  server_name mafnan.dev www.mafnan.dev;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name mafnan.dev www.mafnan.dev;

  ssl_certificate     /etc/letsencrypt/live/mafnan.dev/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mafnan.dev/privkey.pem;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # hashed build assets never change
  location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
